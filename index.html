    html { scroll-behavior: smooth; }
    
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(40px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes wordReveal {
      from { opacity: 0; transform: translateY(100%); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0px); }
    }

    .animate-fade-up { animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; }

    .animate-word-reveal { display: inline-block; overflow: hidden; vertical-align: bottom; }
    .animate-word-reveal > span { 
      display: inline-block;

    .delay-300, .delay-300 > span { animation-delay: 0.3s; }

                  className="bg-transparent border-b border-white/30 py-2 w-full focus:outline-none focus:border-white text-white rounded-none"
                />
                <button className="border-b border-white/30 py-2 hover:border-white transition-colors">
                  <ArrowRight size={20} />
                </button>
              </div>
            </div>
          </div>
          
          <div className="pt-8 border-t border-white/10 flex flex-col sm:flex-row justify-between items-center gap-4 text-white/40 text-sm">
            <p>&copy; 2026 TerraElix Inc. All rights reserved.</p>
            <div className="flex gap-6">
              <a href="#" className="hover:text-white transition-colors">Privacy Policy</a>
              <a href="#" className="hover:text-white transition-colors">Terms of Service</a>
            </div>
          </div>
        </div>
      </footer>
    );

    const App = () => {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [currentSlide, setCurrentSlide] = useState(0);

      const carouselCards = [
        { icon: FlaskConical, bg: 'bg-black', text: 'Experience our newly enhanced natural formula' },
        { icon: Leaf, bg: 'bg-emerald-800', text: 'Pure organic ingredients sourced sustainably' },
        { icon: Droplets, bg: 'bg-cyan-800', text: 'Advanced bioavailability for maximum absorption' },
        { icon: Sun, bg: 'bg-amber-700', text: 'Clinically tested for daily energy & vitality' }
      ];

      useEffect(() => {
        const interval = setInterval(() => {
          setCurrentSlide(prev => (prev + 1) % carouselCards.length);
        }, 3500);
        return () => clearInterval(interval);
      }, [carouselCards.length]);

      return (
        <div className="w-full">
          <Hero 
            mobileMenuOpen={mobileMenuOpen} 
            setMobileMenuOpen={setMobileMenuOpen} 
            currentSlide={currentSlide}
            carouselCards={carouselCards}
          />
          <FeaturesSection />
          <ProductsSection />
          <Footer />
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
